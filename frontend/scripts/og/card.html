<!doctype html>
<!-- One share card, 1200x630. render.mjs fills #eyebrow, #headline and #sub per route. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #02081e; }
  .card { position: relative; width: 1200px; height: 630px; font-family: Poppins, sans-serif; color: #d5dbea; }
  /* The intro's ballroom, ball on the right, faded into ink under the words. */
  .room { position: absolute; top: -40px; right: -330px; width: 1170px; height: 731px; background: url(../../components/intro-assets/poster.webp) center / cover; }
  .fade { position: absolute; inset: 0; background:
    linear-gradient(90deg, #02081e 0%, #02081e 34%, rgb(2 8 30 / 0.82) 50%, rgb(2 8 30 / 0) 72%),
    radial-gradient(ellipse 55% 60% at 12% 0%, rgb(59 91 255 / 0.22), transparent 70%),
    linear-gradient(0deg, rgb(2 8 30 / 0.85), transparent 30%); }
  .copy { position: absolute; left: 72px; top: 92px; width: 640px; display: flex; flex-direction: column; gap: 26px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 600; letter-spacing: 0.22em; color: #e8c268; }
  .eyebrow svg { width: 20px; height: 20px; }
  h1 { margin: 0; font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 86px; line-height: 0.95; letter-spacing: -0.04em; }
  h1 span { display: block; }
  .chrome { background-image: linear-gradient(180deg, #fbfcff 0%, #d5dbea 30%, #a3adc4 45%, #f8faff 50%, #6f7a96 55%, #9aa5c0 72%, #e7ebf4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-box-decoration-break: clone;
    filter: drop-shadow(0 2px 0 rgb(2 8 30 / 0.9)); }
  .sub { margin: 0; font-size: 27px; line-height: 1.4; color: #9aa5c0; max-width: 580px; }
  .lockup { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 14px; }
  .lockup img { width: 52px; height: 52px; border-radius: 12px; }
  .word { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; color: #f3f1ea; }
  .word b { background: linear-gradient(90deg, #3b5bff, #7a2cff 35%, #e83fd0 65%, #ff7a3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chip { border: 2px solid rgb(255 201 60 / 0.45); color: #ffc93c; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; padding: 3px 10px; border-radius: 6px; }
  .paddle { position: absolute; right: 86px; bottom: 64px; width: 128px; transform: rotate(8deg); filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.55)); }
  .paddle .face { width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbfaf5, #dcdfe8 70%); border: 5px solid #b8892f;
    display: flex; align-items: center; justify-content: center; font-family: "Archivo Black", sans-serif; font-size: 66px; color: #02081e; letter-spacing: -0.04em; }
  .paddle .stick { width: 18px; height: 96px; margin: -6px auto 0; border-radius: 0 0 9px 9px; background: linear-gradient(90deg, #6b4d22, #b8892f 50%, #3a2a14); }
</style>
</head>
<body>
<div class="card">
  <div class="room"></div>
  <div class="fade"></div>
  <div class="copy">
    <div class="eyebrow">
      <svg viewBox="-1 -1 2 2" aria-hidden="true"><path fill="#e8c268" d="M0 -1 C0.1 -0.25 0.25 -0.1 1 0 C0.25 0.1 0.1 0.25 0 1 C-0.1 0.25 -0.25 0.1 -1 0 C-0.25 -0.1 -0.1 -0.25 0 -1 Z"/></svg>
      <span id="eyebrow">DANCING WITH THE STARS</span>
    </div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="paddle" aria-hidden="true"><div class="face" id="paddle">10</div><div class="stick"></div></div>
  <div class="lockup">
    <img src="../../public/brand/mark-96.png" alt="">
    <span class="word">Armchair <b>Judge</b></span>
    <span class="chip">DWTS</span>
  </div>
</div>
</body>
</html>
