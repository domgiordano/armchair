name: Deploy Hub

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      # The landing's stats strip is counted from the season catalog at build time.
      - "fixtures/seasons/**"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  # The hub bucket is named after its domain (Terraform var.hub_domain_name).
  S3_BUCKET: armchairjudge.com

permissions:
  contents: read

jobs:
  wait-for-terraform:
    permissions:
      actions: read # find the Terraform run on this commit
      contents: read
    uses: ./.github/workflows/wait-for-terraform.yml

  # AWS_ROLE_ARN comes from the first Terraform apply, so the first push to main
  # runs before it exists. Secrets cannot be read in a job-level `if`, hence
  # this job.
  check-role:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::notice::AWS_ROLE_ARN is not set; skipping deploy. Set it to the deploy_role_arn Terraform output."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [wait-for-terraform, check-role]
    if: needs.check-role.outputs.configured == 'true'
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same SSM reads as deploy-frontend.yml, with the hub's own app client.
      # The client comes from xomware-infrastructure, which must have applied
      # before this runs or get-parameter fails the job.
      - name: Resolve Cognito and API config from SSM
        run: |
          set -euo pipefail
          get() {
            aws ssm get-parameter --name "$1" \
              --query Parameter.Value --output text
          }
          {
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$(get /armchair/shared/cognito/user-pool-id)"
            echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$(get /armchair/shared/cognito/clients/hub-id)"
            echo "NEXT_PUBLIC_COGNITO_DOMAIN=$(get /armchair/shared/cognito/hosted-ui-domain)"
            echo "NEXT_PUBLIC_API_URL=$(get /armchair/api-url)"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          # The hub's postbuild verify fails unless the values above reached the bundle.
          REQUIRE_AUTH_ENV: "1"
        run: npm run build

      # Found by the alias it serves rather than stored as a secret: exactly one
      # distribution fronts this hostname.
      - name: Resolve CloudFront distribution
        run: |
          set -euo pipefail
          ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, '${S3_BUCKET}')].Id | [0]" \
            --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No CloudFront distribution serves ${S3_BUCKET}" >&2
            exit 1
          fi
          echo "DISTRIBUTION_ID=$ID" >> "$GITHUB_ENV"

      - name: Sync to S3
        # Hashed assets first, then the other assets, then HTML, so no HTML
        # lands before what it references.
        #
        # Only _next/static/ is content-hashed, so only it is immutable. Every
        # other file keeps its name across builds (icons, the OG image, public/),
        # and a year of immutable on those kept a replaced intro poster in every
        # browser that had seen the old one. That set goes up with cp, not sync:
        # sync skips a file whose size and mtime match the object, which would
        # leave the old Cache-Control on it.
        #
        # No --delete: a tab loaded from the previous build keeps fetching that
        # build's assets and RSC payloads on client navigation. Deleting them
        # turns every link in that tab into a silent no-op until a hard refresh.
        # Old builds are pruned below instead.
        run: |
          aws s3 sync ./out "s3://${S3_BUCKET}/" \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp ./out "s3://${S3_BUCKET}/" --recursive \
            --exclude "_next/static/*" --exclude "*.html" --exclude "*.txt" \
            --cache-control "public, max-age=300, must-revalidate"
          aws s3 sync ./out "s3://${S3_BUCKET}/" \
            --exclude "*" --include "*.html" --include "*.txt" \
            --cache-control "no-cache, must-revalidate"

      - name: Prune assets older than 7 days
        # Far longer than anyone keeps a tab open, short enough that orphaned
        # builds never pile up.
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix "_next/static/" \
            --query "Contents[?LastModified<'${CUTOFF}'].Key" --output text \
          | tr '\t' '\n' | while read -r key; do
              [ -n "$key" ] && [ "$key" != "None" ] && aws s3 rm "s3://${S3_BUCKET}/$key"
            done

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
