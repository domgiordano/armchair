name: Seed Season

# Writes a fixtures/seasons/ file into the catalog table, and optionally copies
# its Commons headshots to the site bucket. Idempotent: the seed script never
# overwrites fields the poller or an admin owns.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "fixtures/seasons/ file stem"
        required: true
        default: dwts-35
      headshots:
        description: "Also copy headshots to the site bucket"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mint the OIDC token traded for the deploy role

env:
  AWS_REGION: us-east-1
  SITE_BUCKET: dwts.armchairjudge.com

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install boto3
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Seed
        run: |
          if [ "${{ inputs.headshots }}" = "true" ]; then
            python scripts/seed_season.py "${{ inputs.season }}" --headshots "$SITE_BUCKET"
          else
            python scripts/seed_season.py "${{ inputs.season }}"
          fi
