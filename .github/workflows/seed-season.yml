name: Seed Season

# Writes fixtures/seasons/ files into the catalog table, and optionally crops
# their Commons headshots to face-centred squares in the site bucket. A finished
# season's performances and results are published too, confirmed. "all" seeds
# every fixture, S1-S35.
# Every run also rewrites the cross-season person index, bios from fixtures/bios.json.
# Idempotent: the seed script never overwrites fields the poller or an admin owns,
# and only crops headshots the bucket doesn't already have.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "fixtures/seasons/ file stem, or all"
        required: true
        default: all
      headshots:
        description: "Also crop missing headshots into the site bucket"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # mint the OIDC token traded for the deploy role

env:
  AWS_REGION: us-east-1
  SITE_BUCKET: dwts.armchairjudge.com

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install boto3 -r scripts/requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Seed
        run: |
          if [ "${{ inputs.headshots }}" = "true" ]; then
            python scripts/seed_season.py "${{ inputs.season }}" --headshots "$SITE_BUCKET"
          else
            python scripts/seed_season.py "${{ inputs.season }}"
          fi
