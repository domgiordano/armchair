name: Seed Traitors Season

# Writes one Traitors season's catalog items from its live Wikipedia page (by page id).
# Re-running is safe: results, factions and exits belong to the poller and are never
# written here, and openAt is kept unless open_at is given.

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Edition"
        type: choice
        options: [tus, tuk, tukc]
      season:
        description: "Season number within the edition"
        required: true
      pageid:
        description: "Wikipedia page id"
        required: true
      current:
        description: "The edition's live season"
        type: boolean
        default: true
      open_at:
        description: "UTC; episodes released before it are closed (blank keeps the stored value)"
        required: false

permissions:
  contents: read
  id-token: write # mint the OIDC token traded for the deploy role

env:
  AWS_REGION: us-east-1

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install boto3
      - uses: Xomware/github-actions/actions/load-infisical-secrets@v1
        with:
          path: /armchair
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Seed
        env:
          SHOW: ${{ inputs.show }}
          SEASON: ${{ inputs.season }}
          PAGEID: ${{ inputs.pageid }}
          CURRENT: ${{ inputs.current }}
          OPEN_AT: ${{ inputs.open_at }}
        run: |
          args=("$SHOW" "$SEASON" "$PAGEID")
          [ "$CURRENT" = "true" ] && args+=(--current)
          [ -n "$OPEN_AT" ] && args+=(--open-at "$OPEN_AT")
          python scripts/seed_traitors_season.py "${args[@]}"
