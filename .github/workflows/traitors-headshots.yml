name: Traitors Headshots

# Finds a headshot for every player of a Traitors season that has none: Commons, then the
# show's Fandom wiki, then Brave if BRAVE_API_KEY is in Infisical. Crops go to the site
# bucket and straight onto the catalog PLAYER and PERSON items. The registry it updates
# (fixtures/traitors-headshots.json) is not committed from here. Re-running only looks
# up players still without one.

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Edition"
        type: choice
        options: [tus, tuk, tukc]
      season:
        description: "Season number within the edition, or all in the catalog"
        required: true
        default: all

permissions:
  contents: read
  id-token: write # mint the OIDC token traded for the deploy role

env:
  AWS_REGION: us-east-1
  SITE_BUCKET: traitors.armchairjudge.com

jobs:
  headshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install boto3 -r scripts/requirements.txt
      - uses: Xomware/github-actions/actions/load-infisical-secrets@v1
        with:
          path: /armchair
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find headshots
        env:
          SHOW: ${{ inputs.show }}
          SEASON: ${{ inputs.season }}
        run: python scripts/find_traitors_headshots.py auto "$SHOW" "$SEASON" --bucket "$SITE_BUCKET"
